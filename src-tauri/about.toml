# cargo-about settings for THIRD-PARTY-NOTICES.txt
# (scripts/third-party-notices.mjs). For a crate under several licenses,
# the first one in this list is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
# The default target; scripts/third-party-notices.mjs passes --target for
# each release package (Windows and Linux).
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
