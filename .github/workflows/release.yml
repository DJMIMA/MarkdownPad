name: Release

# Pushing a tag such as v0.1.0 builds the Windows exe and publishes it as a
# GitHub Release. There is no installer: the release carries a zip with the
# exe, LICENSE.txt and THIRD-PARTY-NOTICES.txt, and the notes come from that
# version's CHANGELOG.md section.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      # Also checks that tauri.conf.json, Cargo.toml and CHANGELOG.md agree.
      - name: Unit tests
        run: npm test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # bundle.active is false, so this builds the exe without an installer.
      - name: Build
        run: npm run tauri -- build

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # The licenses of the bundled npm packages and Rust crates, which
      # their licenses require to ship with the exe.
      - name: Third-party notices
        run: |
          mkdir -p release/MarkdownPad
          node scripts/third-party-notices.mjs release/MarkdownPad/THIRD-PARTY-NOTICES.txt

      - name: Package
        shell: pwsh
        run: |
          $zip = "MarkdownPad-$env:VERSION-windows-x64.zip"
          Copy-Item src-tauri/target/release/markdownpad.exe release/MarkdownPad/MarkdownPad.exe
          Copy-Item LICENSE release/MarkdownPad/LICENSE.txt
          Compress-Archive -Path release/MarkdownPad -DestinationPath "release/$zip"
          $hash = (Get-FileHash "release/$zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content -NoNewline -Encoding ascii "release/$zip.sha256"

      - name: Release notes
        run: node scripts/changelog.mjs "$VERSION" > release/notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_name="MarkdownPad-${VERSION}-windows-x64.zip"
          gh release create "${GITHUB_REF_NAME}" \
            --title "MarkdownPad ${VERSION}" \
            --notes-file release/notes.md \
            "release/$zip_name" "release/$zip_name.sha256"
